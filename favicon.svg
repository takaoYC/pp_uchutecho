  <rect width="32" height="32" rx="7" ry="7" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="6" ry="6" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

  <!-- Corner star dots -->
