<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ピピの宇宙手帖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;600;700;800&family=Noto+Serif+JP:wght@400;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/shared.js"></script>
</head>
<body>

<header>
  <div class="site-title">宇宙手帖</div>
  <nav>
    <a href="works.html">作品集</a>
    <a href="books.html">書單</a>
  </nav>
  <div class="header-right">
    <button class="toggle-btn" id="themeToggle" aria-label="切換夜間模式"></button>
    <span class="toggle-icon" id="themeIcon"></span>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <div class="star-deco">✦ ✧ ✦</div>
    <h1>宇宙手帖</h1>
    <div class="page-hero-desc" style="margin-top:20px;text-align:left;">
      <p class="page-hero-jp">こんにちは。<br><br>ㄅ級分なスモークマシンです。<br><br>宇宙の片隅で、ピピという星を観測しています。</p>
      <p class="page-hero-zh">大家好。<br><br>我是ㄅ級分的煙機。<br><br>在宇宙的角落，默默記錄著名為PP的星光軌跡。</p>
    </div>
  </div>
</section>

<!-- Works preview -->
<section class="section" id="works">
  <div class="section-header">
    <h2 class="section-title">作品集 <span class="count-tag" id="worksCount"></span></h2>
    <a href="works.html" class="view-all-btn">查看完整清單 →</a>
  </div>
  <div class="works-grid" id="worksGrid">
    <div class="empty-state" style="grid-column:1/-1"><div class="emoji">🎬</div>載入中…</div>
  </div>
</section>

<div class="section-divider"></div>

<!-- Books preview -->
<section class="section" id="books">
  <div class="section-header">
    <h2 class="section-title">書單 <span class="count-tag" id="booksCount"></span></h2>
    <a href="books.html" class="view-all-btn">查看完整清單 →</a>
  </div>
  <div class="books-grid" id="booksGrid">
    <div class="empty-state" style="grid-column:1/-1"><div class="emoji">📚</div>載入中…</div>
  </div>
</section>

<footer>
  <p>宇宙手帖 · 姚愛寗非官方記錄站</p>
  <p style="margin-top:6px;font-size:0.76rem;">内容僅供個人紀錄，版權屬原著作人所有</p>
</footer>

<button class="back-top" id="backTop" aria-label="回到頂端">↑</button>

<script src="js/main.js"></script>
</body>
</html>
